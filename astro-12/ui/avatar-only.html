  <style>
/* Consent banner + footer "Cookie settings" link. Inlined into <head> at build
   time by scripts/prototype-analytics.mjs; uses the page tokens (--ink, --paper,
   --marigold, --text, --mono). Position slots are picked by analytics.js. */
.cc {
  position: fixed;
  z-index: 50;
  box-sizing: border-box;
  width: min(
    400px,
    calc(
      100vw -
      24px -
      env(safe-area-inset-left, 0px) -
      env(safe-area-inset-right, 0px)
    )
  );
  margin: 0;
  padding: 14px 16px 16px;
  border: 3px solid var(--ink, #2b1b14);
  border-radius: 20px;
  background: var(--paper, #fff6e4);
  color: var(--ink, #2b1b14);
  box-shadow: 5px 6px 0 var(--ink, #2b1b14);
  font: 500 15px / 1.4 var(--text, system-ui, sans-serif);
  opacity: 1;
  transform: none;
}
.cc[hidden] {
  display: none;
}
.cc.cc-moving {
  visibility: hidden;
  opacity: 0;
}
.cc.cc-in {
  animation: cc-in 0.28s var(--out, ease-out) both;
}
@keyframes cc-in {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
}
.cc.s-bl {
  left: max(12px, env(safe-area-inset-left, 0px));
  bottom: max(12px, calc(env(safe-area-inset-bottom, 0px) + 8px));
}
.cc.s-br {
  right: calc(max(12px, env(safe-area-inset-right, 0px)) + 84px);
  bottom: max(12px, calc(env(safe-area-inset-bottom, 0px) + 8px));
  width: min(
    400px,
    calc(
      100vw -
      108px -
      env(safe-area-inset-left, 0px) -
      env(safe-area-inset-right, 0px)
    )
  );
}
.cc.s-tl {
  left: max(12px, env(safe-area-inset-left, 0px));
  top: calc(max(12px, env(safe-area-inset-top, 0px)) + 56px);
  width: min(
    400px,
    calc(
      100vw -
      108px -
      env(safe-area-inset-left, 0px) -
      env(safe-area-inset-right, 0px)
    )
  );
}
.cc.s-tr {
  right: max(12px, env(safe-area-inset-right, 0px));
  top: calc(max(12px, env(safe-area-inset-top, 0px)) + 56px);
}
.cc-k {
  margin: 0 0 4px;
  color: var(--tomato-d, #a8321e);
  font: 500 11px / 1.2 var(--mono, ui-monospace, monospace);
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.cc-t {
  margin: 0;
  text-wrap: pretty;
}
.cc-b {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}
.cc-btn {
  flex: 1 1 0;
  min-height: 44px;
  padding: 0 14px;
  border: 2.5px solid var(--ink, #2b1b14);
  border-radius: 999px;
  background: #fff;
  color: var(--ink, #2b1b14);
  box-shadow: 3px 3px 0 var(--ink, #2b1b14);
  font: 700 15px / 1 var(--text, system-ui, sans-serif);
  cursor: pointer;
}
.cc-btn:hover {
  background: var(--marigold, #f6b43c);
}
.cc-btn:active {
  transform: translate(2px, 2px);
  box-shadow: 1px 1px 0 var(--ink, #2b1b14);
}
.cc-btn:focus-visible {
  outline: 3px solid var(--ink, #2b1b14);
  outline-offset: 3px;
}
.cc-open {
  display: inline;
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  text-decoration: underline;
  text-decoration-thickness: 1.5px;
  text-underline-offset: 3px;
  cursor: pointer;
}
.cc-open:focus-visible {
  outline: 3px solid var(--ink, #2b1b14);
  outline-offset: 3px;
  border-radius: 4px;
}
@media (max-width: 420px) {
  .cc {
    padding: 12px 14px 14px;
    font-size: 14px;
  }
  .cc-btn {
    font-size: 14px;
  }
}
@media (prefers-reduced-motion: reduce) {
  .cc.cc-in {
    animation: none;
  }
  .cc-btn:active {
    transform: none;
  }
}
.is-static .cc.cc-in {
  animation: none;
}
html.cc-pad body {
  padding-bottom: var(--cc-h, 0px);
}
@media (max-width: 360px), (max-height: 600px) {
  .cc-k {
    display: none;
  }
  .cc-b {
    margin-top: 10px;
  }
}
.cc-short {
  display: none;
}
/* Compact one-line banner: 320px phones and phones in landscape. */
.cc.cc-compact {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 10px;
  padding: 7px 8px 7px 12px;
  border-width: 2.5px;
  border-radius: 16px;
  box-shadow: 4px 4px 0 var(--ink, #2b1b14);
  font-size: 13.5px;
  line-height: 1.25;
}
.cc.cc-compact[hidden] {
  display: none;
}
.cc.cc-compact .cc-k {
  display: none;
}
.cc.cc-compact .cc-t {
  flex: 1 1 auto;
  min-width: 0;
}
.cc.cc-compact .cc-long {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
.cc.cc-compact .cc-short {
  display: inline;
}
.cc.cc-compact .cc-b {
  flex: none;
  gap: 6px;
  margin: 0;
}
.cc.cc-compact .cc-btn {
  flex: none;
  min-height: 32px;
  padding: 0 11px;
  border-width: 2px;
  box-shadow: 2px 2px 0 var(--ink, #2b1b14);
  font-size: 13px;
}
.cc.cc-compact.s-bl,
.cc.cc-compact.s-tr {
  width: min(
    360px,
    calc(
      100vw -
      24px -
      env(safe-area-inset-left, 0px) -
      env(safe-area-inset-right, 0px)
    )
  );
}
.cc.cc-compact.s-br,
.cc.cc-compact.s-tl {
  width: min(
    360px,
    calc(
      100vw -
      108px -
      env(safe-area-inset-left, 0px) -
      env(safe-area-inset-right, 0px)
    )
  );
}
/* Bottom, full width; the card layer, avatar and a bottom globe slide up. */
.cc.s-lift {
  left: max(12px, env(safe-area-inset-left, 0px));
  right: max(12px, env(safe-area-inset-right, 0px));
  bottom: max(10px, calc(env(safe-area-inset-bottom, 0px) + 6px));
  width: auto;
}
html.cc-lift .copies,
html.cc-lift .hud,
html.cc-lift.m-desk .globe-btn {
  translate: 0 calc(-1 * var(--cc-lift, 0px));
}
/* /ui/ docs pages: small footer with the way home and Cookie settings. */
.cc-foot {
  margin: 48px 0 0;
  padding: 16px max(20px, 5vw) calc(24px + env(safe-area-inset-bottom, 0px));
  border-top: 2px dashed rgba(43, 27, 20, 0.28);
  color: var(--ink2, #5b4536);
  font: 500 14px / 1.5 var(--text, system-ui, sans-serif);
}
.cc-foot a {
  color: inherit;
  text-decoration: underline;
  text-decoration-thickness: 1.5px;
  text-underline-offset: 3px;
}
</style>
